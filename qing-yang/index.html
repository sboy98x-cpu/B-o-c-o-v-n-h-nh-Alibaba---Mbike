<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qing Yang · Báo cáo vận hành Alibaba</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
:root{--navy:#102A43;--blue:#2563EB;--blue2:#DBEAFE;--green:#16A34A;--green2:#DCFCE7;--amber:#D97706;--amber2:#FEF3C7;--red:#DC2626;--red2:#FEE2E2;--bg:#F3F6FA;--ink:#172033;--muted:#5b6678;--line:#E4EAF1;--shadow:0 2px 8px rgba(16,42,67,.07);--h1:#1f4d3a;--h2:#2f855a}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.wrap{max-width:1440px;margin:auto;padding:20px 28px 48px}
.langbar{display:none;justify-content:flex-end;gap:8px;margin-bottom:10px}
.langbar.on{display:flex}
.langbar button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 18px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;min-height:44px;color:var(--navy)}
.langbar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:18px;padding:24px 28px}
.hero .kick{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero h1{font-size:24px;margin:4px 0 8px;letter-spacing:-.02em;line-height:1.25}
.hero .headline{font-size:18px;font-weight:800;margin:6px 0 10px;max-width:900px;line-height:1.4}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px;max-width:980px}
.pn div{border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;font-weight:600}
.pn b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.pn .p{background:rgba(34,197,94,.22);border:1px solid rgba(134,239,172,.55)}
.pn .n{background:rgba(251,146,60,.25);border:1px solid rgba(253,186,116,.6)}
.periods{font-size:11.5px;opacity:.85;margin:0 0 14px}
.hk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.hkc{background:rgba(255,255,255,.96);color:var(--ink);border-radius:14px;padding:12px 14px}
.hkc .l{font-size:12px;color:var(--muted);font-weight:700}
.hkc .v{font-size:26px;font-weight:900;letter-spacing:-.04em;line-height:1.15;margin:2px 0}
.hkc .s{font-size:11.5px;color:var(--muted)}
.hkc.pos .v{color:var(--green)}.hkc.urg .v{color:var(--red)}.hkc.mid .v{color:var(--amber)}
.owner{background:linear-gradient(135deg,#f97316,#dc2626);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.owner b{font-size:15px;display:block}.owner span{font-size:13px;opacity:.95}
.owner a{background:#fff;color:#b91c1c;font-weight:850;text-decoration:none;padding:12px 18px;border-radius:12px;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.nav{position:sticky;top:0;z-index:50;background:rgba(243,246,250,.95);backdrop-filter:blur(6px);display:flex;gap:8px;padding:10px 0;margin-bottom:8px}
.nav a{white-space:nowrap;text-decoration:none;color:var(--navy);font-weight:750;font-size:13px;background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:20px}
.nav a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.area-title{font-size:21px;font-weight:850;color:var(--navy);margin:24px 0 4px;letter-spacing:-.02em}
.area-lead{font-size:14.5px;color:#33415c;font-weight:700;margin:0 0 14px}
.section{background:#fff;border-radius:16px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.section h2{font-size:16px;margin:0 0 6px}
.lead{font-weight:800;font-size:15px;color:var(--navy);background:linear-gradient(90deg,#e8f0ff,#fff);border-left:4px solid var(--blue);padding:10px 14px;border-radius:8px;line-height:1.5;margin:0 0 14px}
.note{font-size:12px;color:var(--muted);margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tag{display:inline-flex;align-items:center;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
.tag.red{color:var(--red);background:var(--red2)}.tag.amber{color:var(--amber);background:var(--amber2)}.tag.green{color:#166534;background:var(--green2)}.tag.blue{color:var(--blue);background:var(--blue2)}.tag.gray{color:#536074;background:#eef1f5}
.bgroup h2{display:flex;align-items:center;gap:10px;font-size:18px;margin:0 0 4px;flex-wrap:wrap}
.bgroup h2 i{font-style:normal;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;color:#fff}
.bgroup.big h2 i{background:var(--red)}.bgroup.paid h2 i{background:var(--green)}
.bdef{font-size:13px;color:var(--muted);margin:0 0 12px}
.bcard{border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line);border-left:6px solid #94a3b8;background:#fff;box-shadow:0 1px 4px rgba(16,42,67,.06)}
.big .bcard{border-left-color:var(--amber);background:linear-gradient(90deg,#fffbeb,#fff 45%)}
.big .bcard.top{border-left-color:var(--red);background:linear-gradient(90deg,#fff5f5,#fff 45%)}
.paid .bcard{border-left-color:var(--green);background:linear-gradient(90deg,#f0fdf4,#fff 45%)}
.bh{display:flex;gap:10px;align-items:flex-start}
.rank{flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.big .top .rank{background:var(--red)}.paid .rank{background:var(--green)}
.who{flex:1 1 0;min-width:90px}
.bn{font-size:16.5px;font-weight:850;color:var(--navy);line-height:1.3;word-break:break-word}
.ctry{display:inline-block;margin-top:3px;font-size:12px;color:#475569;background:#f1f5f9;border-radius:20px;padding:2px 9px}
.pill{flex:none}
.sig{margin:10px 0 4px}
.chip{display:inline-block;background:var(--blue2);color:#1e40af;font-weight:800;border-radius:8px;padding:3px 10px;font-size:13px;line-height:1.4}
.row{font-size:14px;margin:8px 0;line-height:1.5}
.row b,.nextbox b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#7a8699;margin-bottom:1px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bcard.open .clamp{display:block;-webkit-line-clamp:unset}
.nextbox{margin-top:8px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;color:#1e3a8a}
.big .nextbox{background:#fffbeb;border-color:#fde68a;color:#78350f}
.paid .nextbox{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
.nextbox b{opacity:.7;color:inherit}
.more-detail{display:none}
.bcard.open .more-detail{display:block}
.tl{margin:6px 0 0;padding-left:16px;font-size:13px;color:#455066}
.bf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.dt{font-size:12.5px;font-weight:750;color:var(--muted)}
.lnk{border:0;background:transparent;color:var(--blue);font:inherit;font-size:13px;font-weight:800;cursor:pointer;padding:10px 4px;min-height:44px}
.extra{display:none}
.extra.show{display:block;animation:fd .22s ease}
@keyframes fd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:12px 16px;border-radius:12px;border:0;cursor:pointer;font-family:inherit;min-height:46px}
.btn.wide{width:100%}.btn.ghost{background:#eef2f7;color:var(--navy)}
.empty{background:#f0fdf4;border:1px dashed #86efac;border-radius:14px;padding:16px;font-weight:700;color:#166534;font-size:14px}
.rule{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.bm{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.bmc{border:1px solid var(--line);border-radius:14px;padding:15px;border-top:4px solid var(--blue)}
.bmc.green{border-top-color:var(--green)}.bmc.amber{border-top-color:var(--amber);background:#fffdf5}
.bmc h3{margin:0 0 10px;font-size:15px}
.bar{margin:8px 0}
.bar .bl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:3px;gap:8px}
.bar .bl b{color:var(--ink)}
.bar .tr{height:10px;background:#eef2f7;border-radius:6px;overflow:hidden}
.bar .fl{height:100%;border-radius:6px}
.pcts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.bmc p{font-size:13px;color:#1f2a44;font-weight:700;margin:0}
.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metric{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.metric .n{font-size:24px;font-weight:850}
.metric .l{font-size:12px;color:var(--muted)}
.metric .d{font-size:12px;font-weight:800;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}
.chart{width:100%;height:320px}
.chart.cty{height:440px}.chart.kw{height:440px}.chart.lg{height:320px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-bottom:8px;color:#455066}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.warn{background:var(--amber2);border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:650;color:#78350f;margin-bottom:12px}
.pcard{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.pcard .rank{background:var(--blue)}
.pcard .nm{font-weight:750;font-size:14.5px;color:var(--navy);text-decoration:none;line-height:1.4;word-break:break-word}
.pcard .pid{font-size:11.5px;color:var(--muted)}
.pcard .uv{font-size:30px;font-weight:900;color:var(--blue);letter-spacing:-.04em}
.pcard .uv small{font-size:12px;color:var(--muted);font-weight:700}
.searchbar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center}
.searchbar input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px}
.count-pill{font-size:11px;color:var(--muted);background:#f3f5f8;border-radius:20px;padding:4px 10px;white-space:nowrap}
details.dx summary{cursor:pointer;font-weight:800;color:var(--navy);padding:12px 0;min-height:44px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:460px;-webkit-overflow-scrolling:touch}
.table{border-collapse:collapse;width:100%;min-width:620px;font-size:12.5px}
.table th,.table td{padding:8px 10px;text-align:left;border-bottom:1px solid #edf0f4;vertical-align:top}
.table th{background:#f3f5f8;color:#5e6878;font-weight:800;position:sticky;top:0;white-space:nowrap;z-index:1}
.table th.num,.table td.num{text-align:right}
.owner-sum{font-weight:800;font-size:15px;color:var(--navy);background:linear-gradient(90deg,#e8f0ff,#fff);border-left:4px solid var(--blue);padding:12px 14px;border-radius:10px;line-height:1.55;margin:0 0 14px}
.tri{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.col{border-radius:14px;padding:16px;border:1px solid}
.col h3{margin:0 0 8px;font-size:15px}
.col p{margin:0;font-size:14px;font-weight:650}
.col.g{background:var(--green2);border-color:#bbf7d0}.col.g h3{color:#166534}
.col.a{background:var(--amber2);border-color:#fde68a}.col.a h3{color:#92400e}
.act{border-radius:14px;padding:16px;background:var(--blue2);border:1px solid #bfdbfe}
.act.note2{background:var(--amber2);border-color:#fde68a}
.act h3{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center}
.act p{margin:0;font-size:13.5px}
.ops-table th{background:var(--navy);color:#fff}
.ops-table td:first-child,.ops-table th:first-child{position:sticky;left:0;font-weight:800;color:var(--navy);background:#f6f9fc;z-index:2}
.ops-table th:first-child{background:var(--navy);color:#fff}
.notes p{font-size:13px;margin:6px 0}
.foot{text-align:center;color:#9aa2ad;font-size:12px;margin-top:26px;line-height:1.9}
.lb{position:fixed;inset:0;background:rgba(10,20,35,.88);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
@media(min-width:1000px){.blist,.extra.show{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}}
@media(max-width:1100px){.bm{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.hk{grid-template-columns:1fr 1fr}}
@media(max-width:768px){
 body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
 .wrap{padding:10px 12px 20px}
 .hero{padding:16px 14px;border-radius:16px}.hero h1{font-size:20px}.hero .headline{font-size:16px}
 .pn{grid-template-columns:1fr}
 .hk{gap:8px}.hkc{padding:10px 12px}.hkc .v{font-size:23px}
 .owner{padding:12px 14px}.owner a{width:100%;justify-content:center}
 .nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:80;margin:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:4px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(16,42,67,.1)}
 .nav a{flex:1;text-align:center;border:0;border-radius:12px;padding:0 4px;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:12.5px;background:transparent}
 .nav a.on{background:var(--navy);color:#fff}
 .area-title{font-size:20px;margin-top:20px}
 .section{padding:15px 14px;border-radius:14px}
 .bm,.grid2,.grid3,.tri{grid-template-columns:1fr}
 .metric-row{grid-template-columns:1fr 1fr;gap:8px}.metric .n{font-size:21px}
 .chart{height:300px}.chart.cty{height:420px}.chart.lg{height:300px}
 .btn{width:100%}.bcard{padding:13px}
 .pcard .uv{font-size:26px}
}
@media(max-width:420px){.hkc .v{font-size:21px}.hkc .l{font-size:11.5px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="langbar" id="langbar"><button type="button" data-l="vi">Tiếng Việt</button><button type="button" data-l="zh">中文</button></div>
  <header class="hero">
    <div class="kick" id="kick"></div>
    <h1 id="storeName"></h1>
    <div class="headline" id="headline"></div>
    <div class="pn"><div class="p"><b id="pl"></b><span id="pt"></span></div><div class="n"><b id="bl"></b><span id="bt"></span></div></div>
    <p class="periods" id="periods"></p>
    <div class="hk" id="hk"></div>
    <div class="owner"><div><b id="owner_t"></b><span id="owner_s"></span></div><a href="#buyer" id="owner_a"></a></div>
  </header>
  <nav class="nav" id="nav"><a href="#buyer" id="n1"></a><a href="#traffic" id="n2"></a><a href="#san-pham" id="n3"></a><a href="#van-hanh" id="n4"></a></nav>

  <section id="buyer">
    <div class="area-title" id="t1"></div>
    <p class="area-lead" id="buyer_lead"></p>
    <div class="section"><div class="bgroup big">
      <h2><span id="h_big"></span> <i id="cnt_big"></i></h2>
      <p class="bdef" id="d_big"></p>
      <div class="blist" id="l_big"></div><div class="extra blist" id="x_big"></div>
      <button class="btn ghost wide" id="t_big" type="button"></button>
    </div></div>
    <div class="section"><div class="bgroup paid">
      <h2><span id="h_paid"></span> <i id="cnt_paid"></i></h2>
      <p class="bdef" id="d_paid"></p>
      <div class="blist" id="l_paid"></div>
      <div id="paid_empty"></div>
      <p class="rule" id="pay_rule"></p>
    </div></div>
  </section>

  <section id="traffic">
    <div class="area-title" id="t2"></div>
    <p class="area-lead" id="traffic_lead"></p>
    <div class="section">
      <h2 id="bm_h"></h2>
      <p class="lead" id="bm_lead"></p>
      <p class="note" id="bm_note"></p>
      <div class="bm" id="bm"></div>
    </div>
    <div class="section">
      <h2 id="vs_h"></h2>
      <p class="lead" id="vs_lead"></p>
      <p class="note" id="vs_note"></p>
      <div class="metric-row" id="vs_metrics"></div>
    </div>
    <div class="grid2">
      <div class="section"><h2 id="fn_h"></h2><p class="note" id="fn_n"></p><div id="ch_funnel" class="chart"></div></div>
      <div class="section"><h2 id="ct_h"></h2><p class="note" id="ct_n"></p><div id="ch_country" class="chart cty"></div>
        <details class="dx"><summary id="ct_all"></summary><div class="table-wrap"><table class="table" id="tbl_country"></table></div></details></div>
    </div>
    <div class="section"><h2 id="vh_h"></h2><p class="note" id="vh_n"></p><div id="ch_vhist" class="chart"></div></div>
  </section>

  <section id="san-pham">
    <div class="area-title" id="t3"></div>
    <p class="area-lead" id="prod_lead"></p>
    <div class="section"><h2 id="tp_h"></h2><p class="lead" id="tp_lead"></p><div class="grid3" id="tp_cards"></div><p class="note" id="tp_note" style="margin-top:10px"></p></div>
    <div class="section">
      <h2 id="kw_h"></h2>
      <p class="lead" id="kw_lead"></p>
      <p class="note" id="kw_note"></p>
      <div id="kw_warn"></div>
      <div class="legend" id="kw_legend"></div>
      <div id="ch_kw" class="chart kw"></div>
      <details class="dx" id="kw_all"><summary id="kw_all_s"></summary>
        <div class="searchbar"><input id="kw_q" type="search"><span class="count-pill" id="kw_cnt"></span></div>
        <div class="table-wrap"><table class="table" id="tbl_kw"></table></div>
      </details>
    </div>
  </section>

  <section id="van-hanh">
    <div class="area-title" id="t4"></div>
    <div class="section">
      <h2 id="oc_h"></h2>
      <p class="owner-sum" id="oc_sum"></p>
      <div class="tri"><div class="col g"><h3 id="g_h"></h3><p id="g_t"></p></div><div class="col a"><h3 id="a_h"></h3><p id="a_t"></p></div></div>
    </div>
    <div class="section"><h2 id="ac_h"></h2><div class="grid3" id="actions" style="margin-top:12px"></div></div>
    <div class="section"><h2 id="om_h"></h2><p class="note" id="om_n"></p><div class="metric-row" id="ops_metrics"></div>
      <details class="dx notes"><summary id="sn_h"></summary><div id="sn_body"></div></details></div>
    <div class="grid2">
      <div class="section"><h2 id="c1_h"></h2><p class="note" id="c1_n"></p><div id="ch_trend" class="chart lg"></div></div>
      <div class="section"><h2 id="c2_h"></h2><p class="note" id="c2_n"></p><div id="ch_products" class="chart lg"></div></div>
    </div>
    <div class="section"><h2 id="tb_h"></h2><p class="note" id="tb_n"></p><div class="table-wrap" style="max-height:none"><table class="table ops-table" id="tbl_ops"></table></div></div>
  </section>
  <div class="foot" id="foot"></div>

function bi(s){
  if(s==null) return {vi:'',zh:''};
  s=String(s).trim();
  let m=s.match(/^VI:\s*([\s\S]*?)\s*CN:\s*([\s\S]*)$/);
  if(m) return {vi:m[1].trim(),zh:m[2].trim()};
  if(CFG.bilingual){
    for(const sep of [' | ',' / ']){
      if(s.indexOf(sep)>-1){
        const parts=s.split(sep).map(x=>x.trim());
        const zh=parts.filter(p=>CJK.test(p)), vi=parts.filter(p=>!CJK.test(p));
        if(zh.length&&vi.length) return {vi:vi.join(sep),zh:zh.join(sep)};
      }
    }
  }
  return {vi:s,zh:s};
}

  $('tp_cards').innerHTML=OPS.top_products.filter(p=>p.status==='has_uv').map(p=>'<div class="pcard"><div class="rank">'+p.rank+'</div><a class="nm" href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+esc(p.title)+'</a><div class="pid">Product ID: '+esc(p.product_id)+'</div><div class="uv">'+fmt(p.uv)+' <small>UV</small></div><a class="btn" href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+X.open+'</a></div>').join('');
  $('kw_h').textContent=X.kwH; $('kw_lead').textContent=X.kwLead; $('kw_note').textContent=X.kwNote(perVis(cur.period));
  const core=kws.slice();
  $('kw_warn').innerHTML=core.length<3?'<div class="warn">'+X.kwWarn(core.length,kws.length)+'</div>':'';
  $('kw_legend').innerHTML='<span><i style="background:#16A34A"></i>'+X.cls.core+'</span><span><i style="background:#F59E0B"></i>'+X.cls.other+'</span><span><i style="background:#DC2626"></i>'+X.cls.noise+'</span>';
  $('kw_all_s').textContent=X.kwAllS(kws.length); $('kw_q').placeholder=X.kwQ;
  drawKwTable();
  /* conclusion */
  $('oc_h').textContent=X.ocH;
  $('oc_sum').textContent=(zh?'管理建议：':'Quyết định quản trị: ')+pk('management_decision');
  $('g_h').textContent=X.gH; $('g_t').textContent=$('pt').textContent;
  $('a_h').textContent=X.aH; $('a_t').textContent=$('bt').textContent;
  $('ac_h').textContent=X.acH;
  const win=[['next_24_48h',(zh?'24–48小时内':'Trong 24–48 giờ'),'P0','red'],['next_7_days',(zh?'7天内':'Trong 7 ngày'),'P1','amber'],['next_30_days',(zh?'30天内':'Trong 30 ngày'),'P2','blue']];
  $('actions').innerHTML=win.map(w=>'<div class="act"><h3><span class="tag '+w[3]+'">'+w[2]+'</span>'+w[1]+'</h3><ul class="tl" style="margin:0">'+REC[w[0]].map(a=>'<li style="margin-bottom:6px">'+esc(zh?a.cn:a.vi)+(a.owner?' <span class="tag gray">'+esc(a.owner)+'</span>':'')+'</li>').join('')+'</ul></div>').join('')+'<div class="act note2"><h3><span class="tag amber">!</span>'+(zh?'管理决策':'Quyết định quản trị')+'</h3><p>'+esc(pk('management_decision'))+'</p></div>';
  /* ops */
  $('om_h').textContent=X.omH; $('om_n').textContent=X.omN(perFull(wNew.period));
  const dl=(i)=>{ return ''; const d=pct(num(wNew.k[i]),num(wPrev.k[i])); return d==null?'':'<div class="d '+(d>=0?'up':'down')+'">'+(d>=0?'▲ +':'▼ ')+d.toFixed(0)+'% '+X.vsPrev+'</div>'; };
  const pick=[[0,'★'],[3,''],[4,''],[9,'']];
  $('ops_metrics').innerHTML=[0,3,4,7,1,2,10,11].map(i=>'<div class="metric"><div class="n">'+esc(wNew.k[i])+(i===0?' ★':'')+'</div><div class="l">'+X.k[i]+'</div>'+(i===0?'':dl(i))+'</div>').join('');
  $('sn_h').textContent=X.snH;
  const ZHR=['行业平均和行业领先在表格中没有数值：保存为null并显示N/A，不以0代替。','24小时回复率0%伴随0个询盘，不足以评价回复速度。','买家消息、访客、运营三个周期不同，页面分别标注周期。','Top产品UV不是订单也不是询盘。','看板不展示买家完整电话和地址。'];
  $('sn_body').innerHTML=(OPS.source_actions||[]).filter(n=>n.latest).map(n=>{const lb=n.label?L(n.label):''; return '<p>'+(lb?'<b>'+esc(lb)+'</b><br>':'')+esc(L(n.latest))+'</p>';}).join('')+'<p><b>'+(zh?'数据使用说明':'Lưu ý dữ liệu')+'</b></p><ul class="tl">'+SPEC.data_quality_rules.map((r,i)=>'<li>'+esc(zh?ZHR[i]:r)+'</li>').join('')+'</ul>';
  $('c1_h').textContent=X.c1H; $('c1_n').textContent=X.c1N; $('c2_h').textContent=X.c2H; $('c2_n').textContent=X.c2N;
  $('tb_h').textContent=X.tbH; $('tb_n').textContent=X.tbN;
  const wc=weeks.slice().reverse();
  $('tbl_ops').innerHTML='<tr><th>'+X.metric+'</th>'+wc.map(w=>'<th class="num">'+esc(endLabel(w.period))+'</th>').join('')+'</tr>'+X.k.map((lab,i)=>'<tr><td>'+lab+'</td>'+wc.map(w=>'<td class="num">'+esc(w.k[i])+'</td>').join('')+'</tr>').join('');
  $('foot').innerHTML=X.foot+'<br>'+X.pMore;
  document.title=CFG.storeName+' · '+X.kick;
  $('n1').textContent=X.n1;
  if(window.__charts) drawCharts();
}
function drawKwTable(){
  const X=t(), q=($('kw_q').value||'').trim().toLowerCase();
  const list=kws.filter(k=>!q||k.exact_keyword.toLowerCase().includes(q));
  $('kw_cnt').textContent=list.length+' / '+kws.length;
  $('tbl_kw').innerHTML='<tr>'+X.kwCols.map((c,i)=>'<th class="'+(i&&i<3?'num':'')+'">'+c+'</th>').join('')+'</tr>'+list.slice(0,600).map(k=>'<tr><td>'+esc(k.exact_keyword)+'</td><td class="num">'+k.occurrences+'</td><td class="num">'+k.source_row_pv_sum+'</td><td><span class="tag '+(k.cls==='core'?'green':k.cls==='noise'?'red':'gray')+'">'+X.cls[k.cls]+'</span></td></tr>').join('');
}
$('kw_q').addEventListener('input',drawKwTable);

/* ---------- charts ---------- */
let charts=[]; const AXL={fontSize:11};
function mkc(id){ const el=$(id); let c=echarts.getInstanceByDom(el); if(c) c.dispose(); c=echarts.init(el); charts.push(c); return c; }
function drawCharts(){
  if(typeof echarts==='undefined') return;
  const X=t(), mob=MOB(); charts=[];
  mkc('ch_funnel').setOption({tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},legend:{bottom:0,textStyle:{fontSize:12}},series:[{type:'pie',radius:['48%','72%'],center:['50%','44%'],label:{position:'inside',formatter:'{c}',fontSize:15,fontWeight:'bold'},color:['#cbd5e1','#16A34A'],data:[{value:cur.levels.L0,name:'L0'},{value:cur.L1_plus,name:'L1+'}]}]});
  const top=VIS.all_countries.slice().sort((a,b)=>b.visitors-a.visitors||b.L1_plus-a.L1_plus).slice(0,12).reverse();
  const lc=['#cbd5e1','#93c5fd','#3b82f6','#1d4ed8','#16a34a'];
  mkc('ch_country').setOption({tooltip:{trigger:'axis',axisPointer:{type:'shadow'},confine:true},legend:{top:0,textStyle:{fontSize:11}},grid:{left:mob?84:120,right:24,top:34,bottom:20},xAxis:{type:'value',axisLabel:AXL},yAxis:{type:'category',data:top.map(c=>L(c.country).split(/[\/;]/)[0].trim()),axisLabel:{fontSize:11,width:mob?80:116,overflow:'truncate'}},
    series:['L0','L1','L2','L3','L4'].map((k,i)=>({name:k,type:'bar',stack:'lv',data:top.map(c=>c[k]),itemStyle:{color:lc[i]}}))});
  const vh=(VIS.visitor_history||[]).slice().reverse();
  const lab=v=>{const m=String(v.period).match(/(\d{4})-(\d\d)-(\d\d)\D+(\d{4})-(\d\d)-(\d\d)/); return m?m[2]+'/'+m[3]+'–'+m[5]+'/'+m[6]:String(v.tab).slice(-12);};
  (VIS.visitor_history?mkc('ch_vhist'):{setOption(){}}).setOption({tooltip:{trigger:'axis',confine:true},legend:{top:0,textStyle:{fontSize:11}},grid:{left:44,right:40,top:40,bottom:56},xAxis:{type:'category',data:vh.map(lab),axisLabel:Object.assign({},AXL,{rotate:35})},yAxis:[{type:'value',name:X.visitorsL,axisLabel:AXL},{type:'value',name:X.l1,axisLabel:AXL}],
    series:[{name:X.visitorsL,type:'bar',data:vh.map(v=>v.visitor_records),itemStyle:{color:'#93c5fd',borderRadius:[4,4,0,0]}},{name:X.l1,type:'line',yAxisIndex:1,data:vh.map(v=>v.L1_plus),smooth:true,itemStyle:{color:'#16A34A'}}]});
  const core=kws.slice();
  if(core.length>=3){
    $('ch_kw').style.display='';
    const n=12, tk=core.slice(0,n).reverse();
    $('ch_kw').style.height=mob?(tk.length*40+50)+'px':'';
    mkc('ch_kw').setOption({tooltip:{trigger:'item',confine:true,formatter:p=>{const k=tk[p.dataIndex];return '<b>'+esc(k.exact_keyword)+'</b><br>'+(LANG==='zh'?'出现次数':'Số lần')+': '+k.occurrences+'<br>PV '+(LANG==='zh'?'（来源行）':'(dòng nguồn)')+': '+k.source_row_pv_sum;}},
      grid:{left:4,right:mob?64:100,top:10,bottom:24,containLabel:true},xAxis:{type:'value',minInterval:1,axisLabel:AXL},yAxis:{type:'category',data:tk.map(k=>k.exact_keyword),axisLabel:{fontSize:mob?10:11,width:mob?100:200,overflow:'break'}},
      series:[{type:'bar',data:tk.map(k=>({value:k.occurrences,itemStyle:{color:({core:'#16A34A',other:'#F59E0B',noise:'#DC2626'})[k.cls],borderRadius:[0,4,4,0]}})),label:{show:true,position:'right',fontSize:mob?10:11,formatter:p=>{const k=tk[p.dataIndex];return mob?k.occurrences+'×':k.occurrences+'× · PV '+k.source_row_pv_sum;}}}]});
  } else { $('ch_kw').style.display='none'; }
  const wk=weeks.slice().reverse(), xl=wk.map(w=>endLabel(w.period));
  const ax={type:'category',data:xl,axisLabel:Object.assign({},AXL,{rotate:45})};
  mkc('ch_trend').setOption({tooltip:{trigger:'axis',confine:true},legend:{top:0,textStyle:{fontSize:11}},grid:{left:44,right:40,top:40,bottom:50},xAxis:ax,yAxis:[{type:'value',name:X.k[3],axisLabel:AXL},{type:'value',name:'%',min:0,max:100,axisLabel:AXL}],
    series:[{name:X.k[3],type:'bar',data:wk.map(w=>num(w.k[3])),itemStyle:{color:'#2563EB',borderRadius:[4,4,0,0]}},{name:X.k[9],type:'line',yAxisIndex:1,data:wk.map(w=>num(w.k[9])),smooth:true,itemStyle:{color:'#16A34A'}}]});
  mkc('ch_products').setOption({tooltip:{trigger:'axis',confine:true},legend:{top:0,textStyle:{fontSize:11}},grid:{left:44,right:40,top:40,bottom:50},xAxis:ax,yAxis:[{type:'value',name:'Top/Super',axisLabel:AXL},{type:'value',name:X.k[1],axisLabel:AXL}],
    series:[{name:X.k[1],type:'bar',yAxisIndex:1,data:wk.map(w=>num(w.k[1])),itemStyle:{color:'#fca5a5'}},{name:X.k[11],type:'line',data:wk.map(w=>num(w.k[11])),smooth:true,itemStyle:{color:'#D97706'}},{name:X.k[10],type:'line',data:wk.map(w=>num(w.k[10])),smooth:true,itemStyle:{color:'#16A34A'}}]});
}
/* ---------- init ---------- */
if(CFG.bilingual){ $('langbar').classList.add('on'); document.querySelectorAll('.langbar button').forEach(b=>b.addEventListener('click',()=>{ LANG=b.dataset.l; try{localStorage.setItem(CFG.key+'_lang',LANG);}catch(e){} render(); })); }
render();
if(typeof echarts==='undefined'){ ['ch_funnel','ch_country','ch_vhist','ch_kw','ch_trend','ch_products'].forEach(id=>{$(id).innerHTML='<p class="note" style="padding:20px">'+t().noChart+'</p>';}); }
else { window.__charts=true; drawCharts(); let lm=MOB(),rt; const rs=()=>{clearTimeout(rt);rt=setTimeout(()=>{ if(MOB()!==lm){lm=MOB();drawCharts();} else charts.forEach(c=>c.resize()); },150);}; window.addEventListener('resize',rs); window.addEventListener('orientationchange',rs); }
/* nav highlight */
(function(){ const links=[...document.querySelectorAll('#nav a')], secs=links.map(a=>document.querySelector(a.getAttribute('href')));
  function on(){ let cur=0; secs.forEach((s,i)=>{ if(s.getBoundingClientRect().top<160) cur=i; }); links.forEach((a,i)=>a.classList.toggle('on',i===cur)); }
  window.addEventListener('scroll',on,{passive:true}); on(); })();
</script>
</body></html>

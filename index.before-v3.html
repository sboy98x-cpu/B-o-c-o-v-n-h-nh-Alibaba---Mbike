<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qing Yang Wood — Year 2 Dashboard</title>
<style>
:root{
 --forest900:#12372A;--forest800:#185A3D;--forest700:#1F7A4D;--emerald600:#16A36A;--emerald500:#22B573;
 --mint100:#DDF7E9;--mint50:#F3FBF7;--lime:#A7D948;--amber:#F4A62A;--red:#D94B4B;--ink:#17312A;--muted:#647A71;--white:#fff;
 --amber2:#fff3df;--red2:#fdecea;--green2:#e4f8ee;--line:#d8ecdf;--shadow:0 2px 10px rgba(18,55,42,.08)
}
*{box-sizing:border-box}
body{margin:0;background:var(--mint50);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1360px;margin:auto;padding:22px 26px 60px}
.hero{background:linear-gradient(120deg,var(--forest900),var(--emerald600));color:#fff;border-radius:16px;padding:22px 26px;margin-bottom:14px}
.hero h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
.hero .sub{font-size:13px;color:#dff5e9;margin-bottom:10px;max-width:900px}
.hero .badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{font-size:11.5px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24)}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.langbtn,.printbtn{border:1px solid var(--line);background:#fff;color:var(--forest900);font:inherit;font-size:12px;font-weight:800;padding:6px 13px;border-radius:20px;cursor:pointer}
.langbtn.active{background:var(--forest800);color:#fff;border-color:var(--forest800)}
.printbtn{background:var(--emerald600);color:#fff;border-color:var(--emerald600)}
.tabs{display:flex;gap:8px;margin:0 0 16px;overflow:auto;padding-bottom:2px}
.tab{border:2px solid var(--line);border-radius:11px;padding:11px 16px;background:#fff;color:var(--forest900);white-space:nowrap;font:inherit;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 2px 5px rgba(18,55,42,.05);flex:none}
.tab.active{background:var(--forest800);color:#fff;border-color:var(--forest800)}
.pane{display:none}.pane.active{display:block}
.section{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.section h2{font-size:16px;margin:0 0 4px;border-left:4px solid var(--forest700);padding-left:10px}
.section h3{font-size:14px;margin:14px 0 8px;color:var(--forest800)}
.note-line{font-size:12px;color:var(--muted);margin:6px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--mint50)}
.kpi .label{font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:700}
.kpi .value{font-size:22px;font-weight:850}
.kpi .cmp{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi .diag{font-size:12px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.kpi.critical{border-color:#f3c8c8;background:var(--red2)}.kpi.critical .value{color:var(--red)}
.kpi.warning{border-color:#f3ddb0;background:var(--amber2)}.kpi.warning .value{color:var(--amber)}
.kpi.good{border-color:#bfe8d1;background:var(--green2)}.kpi.good .value{color:var(--emerald600)}
.stag{display:inline-flex;font-size:9.5px;font-weight:900;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;margin-left:6px}
.stag.critical{background:#f6cccc;color:#8a2424}.stag.warning{background:#fbe3b4;color:#7a4e08}.stag.good{background:#c6ecd7;color:#0e5c37}
.readorder{display:grid;gap:7px}
.readorder div{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.readorder div:last-child{border-bottom:0}
.conclusions{display:grid;gap:10px}
.cbox{border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative}
.cbox.critical{border-left:5px solid var(--red)}
.cbox.high{border-left:5px solid var(--amber)}
.cbox.medium{border-left:5px solid var(--emerald600)}
.cbox h4{margin:0 0 6px;font-size:14px}
.cbox .cf{font-size:12.5px;margin-top:5px}
.cbox .cf b{color:var(--forest800)}
.today-box{background:linear-gradient(120deg,#fdecea,#fbdcd8);border:1px solid #f0c0ba;border-radius:12px;padding:14px 16px}
.today-box h3{margin:0 0 8px;color:#8a2e28}
.today-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.today-chip{background:#fff;border:1px solid #f0c0ba;border-radius:9px;padding:8px 10px;font-size:12px;cursor:pointer}
.today-chip b{display:block;font-size:13px;color:#8a2e28}
.funnel{display:flex;align-items:stretch;gap:8px;margin:14px 0;flex-wrap:wrap}
.fstage{flex:1;min-width:150px;background:linear-gradient(120deg,var(--forest800),var(--emerald600));color:#fff;border-radius:12px;padding:14px 12px;text-align:center}
.fstage.order{background:linear-gradient(120deg,#7a6f65,#9c9083)}
.fstage .n{font-size:19px;font-weight:850}
.fstage .l{font-size:11px;margin-top:4px;opacity:.92}
.farrow{align-self:center;color:var(--muted);font-size:18px}
.ov-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
.funnel-mini .fstage{padding:10px 8px}
.funnel-mini .fstage .n{font-size:15px}
.funnel-mini .fstage .l{font-size:10px}
.analysis-item{border-left:4px solid var(--forest700);border-radius:0 10px 10px 0;background:var(--mint50);padding:12px 14px;margin-bottom:10px}
.analysis-item.high{border-left-color:var(--amber)}
.analysis-item h4{margin:0 0 7px;font-size:13.5px;color:var(--forest900)}
.analysis-item .al{font-size:12.5px;margin-top:5px;color:#3a4d44}
.analysis-item .al b{color:var(--forest800);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
@media(max-width:900px){.ov-grid{grid-template-columns:1fr}}
.attn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
@media(max-width:900px){.attn-grid{grid-template-columns:1fr}}
.attn-panel{border-radius:13px;padding:16px 17px}
.attn-panel.critical{background:#fdecea;border:1.5px solid #f3c8c8}
.attn-panel.positive{background:var(--mint100);border:1.5px solid #bfe8d1}
.attn-panel.improvement{background:#fff6e2;border:1.5px solid #f3ddb0}
.attn-panel .attn-label{font-size:10.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.attn-panel.critical .attn-label{color:#8a2424}
.attn-panel.positive .attn-label{color:var(--forest700)}
.attn-panel.improvement .attn-label{color:#7a4e08}
.attn-panel .attn-headline{font-size:14.5px;font-weight:800;margin-bottom:10px;color:var(--ink)}
.attn-item{font-size:12.3px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px dashed rgba(0,0,0,.08)}
.attn-item:last-of-type{border-bottom:0}
.attn-item .ai-top{display:flex;justify-content:space-between;font-weight:800;margin-bottom:2px}
.attn-item .ai-val{color:var(--muted);font-weight:700}
.attn-item .ai-why{color:#4a4038}
.attn-item .ai-caveat{color:var(--muted);font-style:italic;margin-top:2px}
.attn-orient{font-size:12px;margin-top:10px;padding-top:9px;border-top:1px solid rgba(0,0,0,.08);font-weight:700}
.attn-panel.critical .attn-orient{color:#8a2424}
.attn-panel.positive .attn-orient{color:var(--forest700)}
.attn-panel.improvement .attn-orient{color:#7a4e08}
.phase-block h3{margin:0 0 4px;font-size:15px;color:var(--forest800)}
.bizq{font-size:12.8px;font-style:italic;color:var(--muted);margin-bottom:10px}
.example-card{background:var(--mint50);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:12.3px}
.example-card b{color:var(--forest800)}
.stagepill{display:inline-block;background:var(--mint100);color:var(--forest700);font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;margin-top:5px}
.gate-box{background:var(--mint100);border:1px solid #bfe8d1;border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--forest800);margin-top:10px;font-weight:700}
.scorecard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.scorecard-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.scorecard-grid{grid-template-columns:1fr}}
.scorecard-item{border:1px solid var(--line);border-radius:11px;padding:13px 14px}
.scorecard-item h4{margin:0 0 8px;font-size:13px;color:var(--forest800)}
.scorecard-item .sq{font-size:11.5px;color:var(--muted);margin-top:8px;font-style:italic}
.stagecard{border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px}
.stagecard .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.stagecard .sh b{font-size:13.5px}
.stagecard .ev{font-size:12.5px;color:#4a4038;margin-bottom:6px}
.stagecard ul{margin:4px 0 0;padding-left:18px}
.stagecard li{font-size:12.3px;margin-bottom:3px;color:#4a4038}
.barchart{display:grid;gap:11px;margin-top:8px}
.barrow{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:12px}
.barrow .lbl{color:var(--muted);font-weight:700}
.bartrack{background:#eaf6ee;border-radius:6px;height:20px;overflow:hidden}
.barfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--forest700),var(--emerald500));display:flex;align-items:center;padding-left:8px;color:#fff;font-weight:800;font-size:11px}
.barfill.critical{background:linear-gradient(90deg,#8a2e28,var(--red))}
.linechart{width:100%;height:160px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px}
.filters input{flex:1;min-width:180px}
.count-pill{font-size:11px;color:var(--muted);background:var(--mint100);border-radius:20px;padding:4px 10px;white-space:nowrap}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.subtab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font:inherit;font-size:12px;font-weight:750;cursor:pointer;color:var(--forest800)}
.subtab.active{background:var(--forest800);color:#fff;border-color:var(--forest800)}
.subpane{display:none}.subpane.active{display:block}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.counter{border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}
.counter .n{font-size:22px;font-weight:850;color:var(--forest800)}
.counter .l{font-size:11.5px;color:var(--muted);margin-top:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.bcard{border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:box-shadow .12s,transform .12s}
.bcard:hover{box-shadow:0 6px 14px rgba(18,55,42,.12);transform:translateY(-2px)}
.bcard .bh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.bcard .bh .nm{font-size:14px;font-weight:800}
.bcard .bc{color:var(--muted);font-size:11.5px;margin-bottom:4px}
.bcard .row{font-size:12.3px;margin-top:5px;color:#4a4038}
.bcard .row b{font-weight:750;color:var(--forest900)}
.lvltag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
.lvltag.vhigh{background:#f6cccc;color:#8a2424}
.lvltag.high{background:#fbe3b4;color:#7a4e08}
.lvltag.mid{background:var(--mint100);color:var(--forest700)}
.lvltag.low{background:#eee6da;color:var(--muted)}
.reasonbox{background:var(--mint50);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.3px}
.reasonbox b{display:block;margin-bottom:3px;color:var(--forest800)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(18,55,42,.45);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px 24px;position:relative}
.modal-close{position:absolute;top:14px;right:16px;border:none;background:var(--mint100);width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--forest900)}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .mc{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.modal .mrow{font-size:13px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px dashed var(--line)}
.modal .mrow:last-child{border-bottom:0}
.modal .mrow b{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;font-weight:800}
.paradox{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:10px}
.pbox{border-radius:12px;padding:16px;text-align:center}
.pbox.big{background:var(--mint100);border:1px solid #bfe8d1}
.pbox.small{background:var(--red2);border:1px solid #f3c8c8}
.pbox .n{font-size:26px;font-weight:850}
.pbox.big .n{color:var(--forest700)}
.pbox.small .n{color:var(--red)}
.pbox .l{font-size:12px;color:var(--muted);margin-top:4px}
.ol-steps{margin:0;padding-left:20px}
.ol-steps li{margin-bottom:8px;font-size:13.3px}
.oppcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:8px}
.oppcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--mint50)}
.oppcard .rank{display:inline-flex;font-size:10.5px;font-weight:900;background:var(--forest800);color:#fff;padding:2px 8px;border-radius:20px;margin-bottom:6px}
.oppcard h4{margin:0 0 6px;font-size:13.5px;color:var(--forest800)}
.oppcard p{margin:0;font-size:12.3px;color:#4a4038}
.checklist2{display:grid;gap:7px}
.check2{display:flex;gap:9px;font-size:13px;align-items:flex-start}
.check2 .ck{flex:none;width:18px;height:18px;border-radius:5px;background:var(--emerald600);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.market-signal-item{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:9px;background:var(--mint50)}
.market-signal-item .msig-h{font-weight:800;font-size:13px;margin-bottom:3px;color:var(--forest800)}
.market-signal-item .msig-v{font-size:12.8px;margin-bottom:4px}
.market-signal-item .msig-u{font-size:11px;color:var(--muted);font-style:italic}
.roadmap{display:grid;gap:12px}
.phase{border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.phase h3{margin:0 0 4px;font-size:14.5px;color:var(--forest800)}
.phase .ptime{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:700}
.phase ul{margin:0;padding-left:20px}
.phase li{font-size:13px;margin-bottom:5px}
.actiontable{width:100%;border-collapse:collapse;font-size:12.5px}
.actiontable th,.actiontable td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.actiontable th{background:var(--mint100);color:var(--forest900);font-weight:800}
.northstar{background:linear-gradient(120deg,var(--forest900),var(--emerald600));color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:13.5px}
.kpichips{display:flex;flex-wrap:wrap;gap:7px}
.kpichip{background:var(--mint100);color:var(--forest800);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700}
.pricegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pricecard{border:2px solid var(--line);border-radius:16px;padding:18px;position:relative;background:#fff}
.pricecard.primary{border-color:var(--emerald600);box-shadow:0 8px 24px rgba(22,163,106,.18);transform:translateY(-4px)}
.ribbon{position:absolute;top:-12px;left:16px;background:var(--emerald600);color:#fff;font-size:11px;font-weight:900;padding:4px 12px;border-radius:20px}
.pcname{font-size:16px;font-weight:850;margin-bottom:2px}
.pctag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;margin-bottom:10px}
.pctag.budget{background:var(--amber2);color:#7a4e08}
.pctag.maintain{background:#eee6da;color:var(--muted)}
.pctag.primary{background:var(--green2);color:var(--forest700)}
.pcprice{font-size:26px;font-weight:900;color:var(--forest800)}
.pcpricevnd{font-size:12px;color:var(--muted);margin-bottom:10px}
.pcstar{font-size:13px;font-weight:750;margin-bottom:4px}
.pcguarantee{font-size:12.5px;color:var(--forest700);font-weight:700;margin-bottom:10px}
.pcbenefits{margin:0 0 10px;padding-left:18px}
.pcbenefits li{font-size:12.3px;margin-bottom:4px}
.pcfit{font-size:12.3px;color:#4a4038;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.pcreason{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:6px}
.disclaimer{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:10px}
.summaryblocks{display:grid;gap:12px}
.sblock{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;gap:14px}
.sblock .num{flex:none;font-size:26px;font-weight:900;color:var(--emerald600)}
.sblock h4{margin:0 0 6px;font-size:15px;color:var(--forest900)}
.sblock p{margin:0;font-size:13.3px;color:#3a4d44}
.foot{text-align:center;color:#8fa79c;font-size:11.5px;margin-top:20px;line-height:1.8}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.paradox{grid-template-columns:1fr}.barrow{grid-template-columns:100px 1fr 50px}.pricegrid{grid-template-columns:1fr}.pricecard.primary{transform:none}.counters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.wrap{padding:14px 12px 40px}.kpis{grid-template-columns:1fr}.hero h1{font-size:18px}}
@media print{
  .topbar,.tabs,.langbtn,.printbtn{display:none!important}
  .pane{display:block!important}
  body{background:#fff}
  .section{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .wrap{max-width:100%;padding:6px}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <button class="langbtn" id="btnVi">Tiếng Việt</button>
    <button class="langbtn" id="btnZh">中文</button>
    <button class="printbtn" id="btnPrint">&#128424; <span id="printLbl">In / Chụp</span></button>
  </div>
  <header class="hero">
    <h1>QING YANG WOOD PRODUCTION TRADING COMPANY LIMITED</h1>
    <div class="sub" id="heroHeadline"></div>
    <div class="badges">
      <span class="badge" id="badgePeriod"></span>
      <span class="badge" id="badgeScope"></span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-pane="overview" id="tab_overview"></button>
    <button class="tab" data-pane="funnel" id="tab_funnel"></button>
    <button class="tab" data-pane="buyers" id="tab_buyers"></button>
    <button class="tab" data-pane="products" id="tab_products"></button>
    <button class="tab" data-pane="roadmap" id="tab_roadmap"></button>
    <button class="tab" data-pane="pricing" id="tab_pricing"></button>
    <button class="tab" data-pane="summary" id="tab_summary"></button>
  </nav>

  <section class="pane active" id="overview">
    <div class="section">
      <div class="ov-grid">
        <div class="ov-chart-col">
          <h2 id="ov_chartTitle"></h2>
          <div class="barchart" id="ov_attainment"></div>
          <h3 id="ov_funnelTitle"></h3>
          <div class="funnel funnel-mini" id="ov_funnel"></div>
        </div>
        <div class="ov-analysis-col">
          <h2 id="ov_analysisTitle"></h2>
          <div id="ov_analysis"></div>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="attn-grid" id="ov_attnGrid"></div>
      <div class="note-line" id="ov_footnote"></div>
    </div>
  </section>

  <section class="pane" id="funnel">
    <div class="section">
      <h2 id="fn_funnelTitle"></h2>
      <div class="funnel" id="fn_funnel"></div>
      <div id="fn_stages"></div>
    </div>
    <div class="section">
      <h2 id="fn_barTitle"></h2>
      <div class="barchart" id="fn_bars"></div>
    </div>

let LANG = localStorage.getItem('qy_lang') || 'vi';
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function levelClass(lv){
  if(lv==='Rất cao'||lv==='非常高') return 'vhigh';
  if(lv==='Cao'||lv==='高') return 'high';
  if(lv==='Trung bình'||lv==='Trung bình-thấp'||lv==='中'||lv==='中低') return 'mid';
  return 'low';
}
function L(item, viField, zhField){ return LANG==='zh' ? (item[zhField]!=null?item[zhField]:item[viField]) : item[viField]; }

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); document.getElementById(b.dataset.pane).classList.add('active');
}));
document.querySelectorAll('.subtab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.subtab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.subpane').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); document.getElementById('sub_'+b.dataset.sub).classList.add('active');
}));
document.getElementById('btnPrint').addEventListener('click', ()=>window.print());
document.getElementById('modalClose').addEventListener('click', ()=>document.getElementById('modalBg').classList.remove('open'));
document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') e.currentTarget.classList.remove('open'); });

function openBuyerModal(item, kind){
  const t = T[LANG];
  let html = '<h3>'+esc(item.name)+' '+(item.flag||'')+'</h3>';
  const country = L(item,'country','country_zh');
  const level = item.level ? L(item,'level','level_zh') : null;
  html += '<div class="mc">'+esc(country)+(level?(' &middot; <span class="lvltag '+levelClass(item.level)+'">'+esc(level)+'</span>'):'')+'</div>';
  if(kind==='review'||kind==='removed'){
    html += '<div class="mrow"><b>'+t.card_reason+'</b>'+esc(L(item,'reason','reason_zh'))+'</div>';
    if(item.evidence) html += '<div class="mrow"><b>'+t.card_evidence+'</b>'+esc(item.evidence)+'</div>';
  } else {
    if(item.company) html += '<div class="mrow"><b>'+t.card_company+'</b>'+esc(item.company)+'</div>';
    html += '<div class="mrow"><b>'+t.card_email+'</b>'+esc(item.email==='暂未看到'?t.noData:item.email)+'</div>';
    html += '<div class="mrow"><b>'+t.card_phone+'</b>'+esc(item.phone==='暂未看到'?t.noData:item.phone)+'</div>';
    html += '<div class="mrow"><b>'+t.card_need+'</b>'+esc(L(item,'need','need_zh'))+'</div>';
    if(item.evidence) html += '<div class="mrow"><b>'+t.card_evidence+'</b>'+esc(item.evidence)+'</div>';
    if(item.commercial_signal) html += '<div class="mrow"><b>'+t.card_commercial+'</b>'+esc(L(item,'commercial_signal','commercial_zh'))+'</div>';
    html += '<div class="mrow"><b>'+t.card_next+'</b>'+esc(L(item,'next_action','next_zh'))+'</div>';
    if(item.conversion_goal) html += '<div class="mrow"><b>'+t.card_goal+'</b>'+esc(L(item,'conversion_goal','goal_zh'))+'</div>';
  }
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}

  // Overview
  function buildFunnelHtml(){
    const stageVals = [PERF.metrics[0].store, PERF.metrics[3].store, PERF.metrics[4].store];
    let h='';
    stageVals.forEach((v,i)=>{
      h += '<div class="fstage"><div class="n">'+v.toLocaleString('en-US')+'</div><div class="l">'+t.fn_stageLabels[i]+'</div></div><div class="farrow">&rarr;</div>';
    });
    h += '<div class="fstage order"><div class="n">'+t.fn_orderNote+'</div><div class="l">'+t.fn_stageLabels[3]+'</div></div>';
    return h;
  }
  document.getElementById('ov_chartTitle').textContent = t.ov_chartTitle;
  const sortedMetrics = PERF.metrics.slice().sort((a,b)=>a.share-b.share);
  document.getElementById('ov_attainment').innerHTML = sortedMetrics.map(m=>{
    const label = LANG==='zh'?m.label_zh:m.label_vi;
    const storeDisp = m.isPct? (LANG==='zh'?'1.10%':'1,10%') : m.store.toLocaleString('en-US');
    const refDisp = m.isPct? (LANG==='zh'?'2.29%':'2,29%') : m.ref.toLocaleString('en-US');
    return '<div class="barrow"><div class="lbl">'+label+'</div><div class="bartrack"><div class="barfill critical" style="width:'+Math.max(4,m.share)+'%">'+t.attainLabel.replace('{pct}',m.share+'%').replace('{store}',storeDisp).replace('{ref}',refDisp)+'</div></div><div>'+m.share+'%</div></div>';
  }).join('');
  document.getElementById('ov_funnelTitle').textContent = t.ov_funnelTitle;
  document.getElementById('ov_funnel').innerHTML = buildFunnelHtml();
  document.getElementById('ov_analysisTitle').textContent = t.ov_analysisTitle;
  document.getElementById('ov_analysis').innerHTML = t.analysisDirections.map(a=>
    '<div class="analysis-item '+a.priority+'"><h4>'+a.title+'</h4>'+
    '<div class="al"><b>'+t.analysisLabels.evidence+'</b>'+a.evidence+'</div>'+
    '<div class="al"><b>'+t.analysisLabels.meaning+'</b>'+a.meaning+'</div>'+
    '<div class="al"><b>'+t.analysisLabels.orientation+'</b>'+a.orientation+'</div></div>'
  ).join('');
  document.getElementById('ov_footnote').textContent = t.ov_footnote;
  document.getElementById('ov_attnGrid').innerHTML = t.attnPanels.map(p=>{
    let itemsHtml = '';
    if(p.type==='metric'){
      itemsHtml = p.items.map(i=>'<div class="attn-item"><div class="ai-top"><span>'+i.metric+'</span><span class="ai-val">'+(i.attainment?i.attainment+' · ':'')+i.value+'</span></div><div class="ai-why">'+i.why+'</div></div>').join('');
    } else if(p.type==='signal'){
      itemsHtml = p.items.map(i=>'<div class="attn-item"><div class="ai-top"><span>'+i.signal+'</span></div><div class="ai-why">'+i.meaning+'</div><div class="ai-caveat">'+i.caveat+'</div></div>').join('');
    } else {
      itemsHtml = p.items.map(i=>'<div class="attn-item"><div class="ai-top"><span>'+i.focus+'</span></div><div class="ai-caveat">'+i.evidence+'</div><div class="ai-why">'+i.improvement+'</div></div>').join('');
    }
    return '<div class="attn-panel '+p.role+'"><div class="attn-label">'+p.label+'</div><div class="attn-headline">'+p.headline+'</div>'+itemsHtml+'<div class="attn-orient">'+p.orientation+'</div></div>';
  }).join('');

  // Funnel
  document.getElementById('fn_funnelTitle').textContent = t.fn_funnelTitle;
  document.getElementById('fn_funnel').innerHTML = buildFunnelHtml();
  document.getElementById('fn_stages').innerHTML = t.fn_stages.map(s=>
    '<div class="stagecard"><div class="sh"><b>'+s.stage+'</b><span class="stag '+s.status+'">'+(t.statusLabels[s.status]||s.status)+'</span></div>'+
    '<div class="ev"><b>'+t.stageLabels.evidence+':</b> '+s.evidence+'</div>'+
    '<div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px">'+t.stageLabels.causes+':</div>'+
    '<ul>'+s.causes.map(c=>'<li>'+c+'</li>').join('')+'</ul></div>'
  ).join('');
  document.getElementById('fn_barTitle').textContent = t.fn_barTitle;
  document.getElementById('fn_bars').innerHTML = PERF.metrics.map(m=>{
    const label = LANG==='zh'?m.label_zh:m.label_vi;
    const storeDisp = m.isPct? m.store+'%' : m.store.toLocaleString('en-US');
    return '<div class="barrow"><div class="lbl">'+label+'</div><div class="bartrack"><div class="barfill critical" style="width:'+Math.max(4,m.share)+'%">'+storeDisp+'</div></div><div>'+m.share+'%</div></div>';
  }).join('');
  document.getElementById('fn_replyTitle').textContent = t.fn_replyTitle;
  document.getElementById('fn_replyNote').textContent = t.fn_replyNote;
  renderReplyLine();

  // Buyers
  document.getElementById('by_h2').textContent = t.by_h2;
  document.getElementById('by_note').textContent = t.by_note;
  document.getElementById('by_counters').innerHTML = t.counters.map(c=>'<div class="counter"><div class="n">'+c[0]+'</div><div class="l">'+c[1]+'</div></div>').join('');
  document.getElementById('subBtnPri').textContent = t.subPri+' ('+(LEADS.priority7.length+LEADS.other10.length)+')';
  document.getElementById('subBtnRev').textContent = t.subRev+' ('+LEADS.review9.length+')';
  document.getElementById('subBtnRem').textContent = t.subRem+' ('+LEADS.removed7.length+')';
  document.getElementById('bySearch').placeholder = t.searchPh;

  const allPriority = [...LEADS.priority7, ...LEADS.other10];
  const levelSel = document.getElementById('byLevel');
  const levels = ['Rất cao','Cao','Trung bình','Trung bình-thấp'];
  const levelLabel = {'Rất cao':LANG==='zh'?'非常高':'Rất cao','Cao':LANG==='zh'?'高':'Cao','Trung bình':LANG==='zh'?'中':'Trung bình','Trung bình-thấp':LANG==='zh'?'中低':'Trung bình-thấp'};
  levelSel.innerHTML = '<option value="">'+t.levelAll+'</option>'+levels.map(l=>'<option value="'+l+'">'+levelLabel[l]+'</option>').join('');
  const countrySel = document.getElementById('byCountry');
  const countries = [...new Set(allPriority.map(p=>p.country))];
  countrySel.innerHTML = '<option value="">'+t.countryAll+'</option>'+countries.map(c=>{
    const item = allPriority.find(p=>p.country===c);
    return '<option value="'+esc(c)+'">'+esc(L(item,'country','country_zh'))+'</option>';
  }).join('');

  function buyerCardHtml(p, rankBadge){
    return '<div class="bcard" data-name="'+esc(p.name)+'">'+
      '<div class="bh"><span class="nm">'+p.flag+' '+esc(p.name)+(rankBadge?(' <span style="font-size:10px;color:var(--muted)">#'+p.rank+'</span>'):'')+'</span><span class="lvltag '+levelClass(p.level)+'">'+esc(L(p,'level','level_zh'))+'</span></div>'+
      '<div class="bc">'+esc(L(p,'country','country_zh'))+(p.company&&p.company!==p.name?(' &middot; '+esc(p.company)):'')+'</div>'+
      '<div class="row"><b>'+t.card_need+':</b> '+esc(L(p,'need','need_zh'))+'</div>'+
      '<div class="row"><b>'+t.card_next+':</b> '+esc(L(p,'next_action','next_zh'))+'</div>'+
      '</div>';
  }
  function renderPriorityCards(){
    const q = (document.getElementById('bySearch').value||'').toLowerCase();
    const lvl = levelSel.value;
    const ctry = countrySel.value;
    const list = allPriority.filter(p=>
      (!q || p.name.toLowerCase().includes(q) || (p.company||'').toLowerCase().includes(q)) &&
      (!lvl || p.level===lvl) && (!ctry || p.country===ctry)
    );
    document.getElementById('cards_pri').innerHTML = list.map(p=>buyerCardHtml(p, !!p.rank)).join('');
    document.querySelectorAll('#cards_pri .bcard').forEach(c=>c.addEventListener('click',()=>{
      const item = allPriority.find(p=>p.name===c.dataset.name);
      openBuyerModal(item,'priority');
    }));
    document.getElementById('byCount').textContent = list.length+' / '+allPriority.length;
  }
  function renderReviewCards(){
    const q = (document.getElementById('bySearch').value||'').toLowerCase();
    const list = LEADS.review9.filter(p=>!q || p.name.toLowerCase().includes(q));
    document.getElementById('cards_rev').innerHTML = list.map((p,idx)=>
      '<div class="bcard" data-idx="'+idx+'"><div class="bh"><span class="nm">'+esc(p.name)+'</span></div>'+
      '<div class="reasonbox"><b>'+t.card_reason+'</b>'+esc(L(p,'reason','reason_zh'))+'</div></div>'
    ).join('');
    document.querySelectorAll('#cards_rev .bcard').forEach(c=>c.addEventListener('click',()=>openBuyerModal(list[+c.dataset.idx],'review')));
  }
  function renderRemovedCards(){
    const q = (document.getElementById('bySearch').value||'').toLowerCase();
    const list = LEADS.removed7.filter(p=>!q || p.name.toLowerCase().includes(q));
    document.getElementById('cards_rem').innerHTML = list.map((p,idx)=>
      '<div class="bcard" data-idx="'+idx+'"><div class="bh"><span class="nm">'+esc(p.name)+'</span></div>'+
      '<div class="reasonbox"><b>'+t.card_reason+'</b>'+esc(L(p,'reason','reason_zh'))+'</div></div>'
    ).join('');
    document.querySelectorAll('#cards_rem .bcard').forEach(c=>c.addEventListener('click',()=>openBuyerModal(list[+c.dataset.idx],'removed')));
  }
  renderPriorityCards(); renderReviewCards(); renderRemovedCards();
  document.getElementById('bySearch').oninput = ()=>{ renderPriorityCards(); renderReviewCards(); renderRemovedCards(); };
  levelSel.onchange = renderPriorityCards;
  countrySel.onchange = renderPriorityCards;

  // Products
  document.getElementById('pd_paradoxTitle').textContent = t.pd_paradoxTitle;
  document.getElementById('pd_productsLbl').textContent = t.pd_productsLbl;
  document.getElementById('pd_shareLbl').textContent = t.pd_shareLbl;
  document.getElementById('pd_demandTitle').textContent = t.pd_demandTitle;
  document.getElementById('pd_oppcards').innerHTML = t.demandCards.map(d=>
    '<div class="oppcard"><span class="rank">#'+d.rank+'</span><h4>'+d.product+' ('+d.idx+')</h4><p>'+d.reason+'</p></div>'
  ).join('');
  document.getElementById('pd_checklistTitle').textContent = t.pd_checklistTitle;
  document.getElementById('pd_checklistNote').textContent = t.pd_checklistNote;
  document.getElementById('pd_checklist').innerHTML = t.checklist.map(c=>'<div class="check2"><span class="ck">&#10003;</span>'+c+'</div>').join('');
  document.getElementById('pd_marketTitle').textContent = t.pd_marketTitle;
  document.getElementById('pd_market').innerHTML = t.marketSignals.map(m=>
    '<div class="market-signal-item"><div class="msig-h">'+m.signal+'</div><div class="msig-v">'+m.value+'</div><div class="msig-u">'+m.usage+'</div></div>'
  ).join('');

  // Roadmap
  document.getElementById('rm_northstar').textContent = t.rm_northstar;
  document.getElementById('rm_disclaimer').textContent = t.y2_disclaimer;
  const al = t.y2_actionLabels;
  document.getElementById('rm_phaseList').innerHTML = t.y2_phases.map(ph=>{
    let h = '<div class="section phase-block"><h3>'+ph.phase+' &middot; '+ph.name+'</h3>';
    h += '<div class="bizq">'+ph.business_question+'</div>';
    h += '<div style="overflow:auto"><table class="actiontable"><tr><th>#</th><th>'+al.action+'</th><th>'+al.owner+'</th><th>'+al.output+'</th></tr>'+
      ph.actions.map((a,i)=>'<tr><td>'+(i+1)+'</td><td>'+a.action+'</td><td>'+a.owner+'</td><td>'+a.output+'</td></tr>').join('')+'</table></div>';
    if(ph.real_examples){
      h += '<h4>'+al.examplesReal+'</h4>'+ph.real_examples.map(e=>
        '<div class="example-card"><b>'+e.buyer+'</b><br>'+e.signal+'<br>&rarr; '+e.example_next_step+'<div class="stagepill">'+e.desired_stage+'</div></div>'
      ).join('');
    }
    if(ph.product_examples){
      h += '<h4>'+al.examplesProduct+'</h4>'+ph.product_examples.map(e=>
        '<div class="example-card"><b>'+e.product+'</b><br>'+e.buyer_evidence+'<br><i>'+e.example_title+'</i><br>'+e.title_caveat+'<br>'+e.gallery_example+'</div>'
      ).join('');
    }
    if(ph.real_example_single){
      h += '<div class="example-card">'+ph.real_example_single+'</div>';
    }
    h += '<h4>'+al.targets+'</h4><div class="checklist2">'+ph.internal_targets.map(x=>'<div class="check2"><span class="ck">&#10003;</span>'+x+'</div>').join('')+'</div>';
    if(ph.gate_to_next_phase){ h += '<div class="gate-box">'+al.gate+': '+ph.gate_to_next_phase+'</div>'; }
    if(ph.success_definition){ h += '<div class="gate-box">'+al.success+': '+ph.success_definition+'</div>'; }
    h += '</div>';
    return h;
  }).join('');
  document.getElementById('rm_scorecardTitle').textContent = t.y2_scorecardTitle;
  document.getElementById('rm_scorecard').innerHTML = t.y2_scorecard.map(s=>
    '<div class="scorecard-item"><h4>'+s.group+'</h4><div class="kpichips">'+s.metrics.map(m=>'<span class="kpichip">'+m+'</span>').join('')+'</div><div class="sq">'+s.owner_question+'</div></div>'
  ).join('');

  // Pricing
  document.getElementById('pr_h2').textContent = t.pr_h2;
  document.getElementById('pr_note').textContent = t.pr_note;
  document.getElementById('pr_disclaimer').textContent = t.pr_disclaimer;
  document.getElementById('pr_logicTitle').textContent = t.pr_logicTitle;
  document.getElementById('pr_logic').innerHTML = t.decisionLogic.map(x=>'<li>'+x+'</li>').join('');
  document.getElementById('pr_cards').innerHTML = t.packages.map(p=>{
    const tagClass = p.name==='Basic'?'maintain':(p.name==='Guarantee Basic'?'budget':'primary');
    const isPrimary = p.name==='Guarantee L3+';
    return '<div class="pricecard'+(isPrimary?' primary':'')+'">'+
      (isPrimary?'<div class="ribbon">'+t.pkgTag[p.name]+'</div>':'')+
      '<div class="pcname">'+p.name+'</div>'+
      '<div class="pctag '+tagClass+'">'+t.pkgTag[p.name]+'</div>'+
      '<div class="pcprice">'+p.usd+'</div><div class="pcpricevnd">'+p.vnd+'</div>'+
      '<div class="pcstar">'+t.pkgLabels.star+': '+p.star+'</div>'+
      '<div class="pcguarantee">'+t.pkgLabels.guarantee+': '+p.guarantee+' &middot; '+t.pkgLabels.kwa+': '+p.kwa+'</div>'+
      '<ul class="pcbenefits">'+p.benefits.map(b=>'<li>'+b+'</li>').join('')+'</ul>'+
      '<div class="pcfit"><b>'+t.pkgLabels.fit+':</b> '+p.fit+'</div>'+
      '<div class="pcreason">'+t.pkgLabels.reason+': '+p.reason+'</div>'+
    '</div>';
  }).join('');

  // Summary
  document.getElementById('sm_h2').textContent = t.sm_h2;
  document.getElementById('sm_blocks').innerHTML = t.summaryBlocks.map(b=>
    '<div class="sblock"><div class="num">'+b.number+'</div><div><h4>'+b.title+'</h4><p>'+b.text+'</p></div></div>'
  ).join('');
}

function renderReplyLine(){
  const svg = document.getElementById('fn_line');
  const W=600,H=180,pad=40;
  const pts = PERF.reply_history;
  const minV=60,maxV=100;
  const x = i => pad + i*((W-2*pad)/(pts.length-1));
  const y = v => H-30 - ((v-minV)/(maxV-minV))*(H-60);
  const refY = y(PERF.reply_ref);
  let sv = '<line x1="'+pad+'" y1="'+refY+'" x2="'+(W-pad)+'" y2="'+refY+'" stroke="#F4A62A" stroke-width="1.5" stroke-dasharray="5,4"/>';
  sv += '<text x="'+(W-pad)+'" y="'+(refY-6)+'" font-size="11" fill="#7a4e08" text-anchor="end">'+PERF.reply_ref+'%</text>';
  let path = pts.map((p,i)=>(i===0?'M':'L')+x(i)+','+y(p.store)).join(' ');
  sv += '<path d="'+path+'" fill="none" stroke="#1F7A4D" stroke-width="3"/>';
  pts.forEach((p,i)=>{
    sv += '<circle cx="'+x(i)+'" cy="'+y(p.store)+'" r="5" fill="#16A36A"/>';
    sv += '<text x="'+x(i)+'" y="'+(y(p.store)-12)+'" font-size="12" fill="#17312A" text-anchor="middle" font-weight="700">'+p.store+'%</text>';
    sv += '<text x="'+x(i)+'" y="'+(H-10)+'" font-size="11" fill="#647A71" text-anchor="middle">'+p.period+'</text>';
  });
  svg.innerHTML = sv;
}

document.getElementById('btnVi').addEventListener('click', ()=>{ LANG='vi'; localStorage.setItem('qy_lang','vi'); renderAll(); });
document.getElementById('btnZh').addEventListener('click', ()=>{ LANG='zh'; localStorage.setItem('qy_lang','zh'); renderAll(); });

renderAll();
</script>
